<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Oracle SQL 工具</title>
  <link rel="stylesheet" href="tooldock://sdk/ui-base.css">
  <style>
    html, body { height: 100%; }
    body { display: grid; grid-template-columns: var(--side, 260px) minmax(0, 1fr); overflow: hidden; }
    body.side-hidden { --side: 0px; }
    body.side-hidden #side { display: none; }

    /* ── 側欄 ── */
    #side { border-right: 1px solid var(--border); background: var(--bg-elevated); display: flex; flex-direction: column; min-height: 0; }
    #sideTabs { display: flex; border-bottom: 1px solid var(--border); }
    #sideTabs button { flex: 1; border-radius: 0; background: transparent; color: var(--fg-muted); border-bottom: 2px solid transparent; min-height: 32px; }
    #sideTabs button.on { color: var(--fg-strong); border-bottom-color: var(--accent); }
    .sidePane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .sidePane[hidden] { display: none; }
    .sideBar { display: flex; gap: 4px; padding: 8px; align-items: center; }
    .sideBar select, .sideBar input { flex: 1; min-width: 0; min-height: 24px; font-size: 12px; }
    .sideBar button { min-height: 24px; padding: 0 8px; font-size: 12px; }
    .list { flex: 1; overflow: auto; font-size: 12.5px; }
    .obj { display: flex; gap: 6px; align-items: center; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
    .obj:hover { background: var(--bg-hover); }
    .obj.sel { background: var(--bg-active); color: var(--fg-strong); }
    .obj .k { font-size: 10px; font-weight: 600; width: 16px; text-align: center; border-radius: 3px; flex: none; }
    .obj .k.T { color: var(--info); } .obj .k.V { color: var(--warn); }
    .obj .n { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .obj .c { color: var(--fg-faint); font-size: 11px; }
    .snip { padding: 6px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .snip:hover { background: var(--bg-hover); }
    .snip .t { display: flex; gap: 6px; align-items: center; }
    .snip .t b { flex: 1; color: var(--fg-strong); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .snip .t button { min-height: 18px; padding: 0 5px; font-size: 11px; visibility: hidden; }
    .snip:hover .t button { visibility: visible; }
    .snip pre { margin: 3px 0 0; font-family: var(--mono); font-size: 11px; color: var(--fg-muted); white-space: pre-wrap; max-height: 34px; overflow: hidden; }
    .sideEmpty { padding: 18px 12px; color: var(--fg-faint); font-size: 12px; text-align: center; }

    /* ── 主區 ── */
    #mainCol { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .bar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .bar button { min-height: 24px; padding: 2px 10px; }
    .bar select { min-width: 200px; }
    .bar .spacer { flex: 1; }
    /* ── 連線分頁 ── */
    #sessBar { display: flex; gap: 2px; align-items: flex-end; padding: 6px 12px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    #sessBar[hidden] { display: none; }
    .sess { display: flex; align-items: center; gap: 6px; background: transparent; color: var(--fg-muted); border: 1px solid transparent; border-bottom: 0; border-radius: 4px 4px 0 0; min-height: 28px; padding: 0 4px 0 10px; white-space: nowrap; }
    .sess:hover { color: var(--fg-strong); }
    .sess.on { background: var(--bg-elevated); color: var(--fg-strong); border-color: var(--border); box-shadow: inset 0 2px 0 var(--accent); }
    .sess .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
    .sess .dot.pending { background: var(--warn); }
    .sess .dot.running { background: var(--info); animation: blink 1s ease-in-out infinite; }
    .sess .x { padding: 0 5px; border-radius: 3px; opacity: .55; }
    .sess .x:hover { opacity: 1; background: var(--bg-hover); }
    #sessCount { margin-left: auto; align-self: center; font-size: 11px; color: var(--fg-faint); white-space: nowrap; padding-left: 8px; }
    @keyframes blink { 50% { opacity: .3; } }
    #connInfo { font-size: 12px; flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #editorWrap { position: relative; height: 38%; min-height: 110px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; }
    #sql { flex: 1; min-height: 0; overflow: hidden; }
    /* SQL 語法顏色（編輯器：ui/vendor/sql-editor.js） */
    :root {
      --syn-keyword: #569cd6; --syn-type: #4ec9b0; --syn-func: #dcdcaa; --syn-string: #ce9178; --syn-ident: #9cdcfe;
      --syn-number: #b5cea8; --syn-comment: #6a9955; --syn-bind: #c586c0; --syn-operator: #d4d4d4;
      --syn-active-line: rgba(255, 255, 255, .04); --syn-selection: rgba(38, 79, 120, .85); --syn-match: rgba(255, 255, 255, .1);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --syn-keyword: #0000ff; --syn-type: #267f99; --syn-func: #795e26; --syn-string: #a31515; --syn-ident: #001080;
        --syn-number: #098658; --syn-comment: #008000; --syn-bind: #af00db; --syn-operator: #3b3b3b;
        --syn-active-line: rgba(0, 0, 0, .035); --syn-selection: #add6ff; --syn-match: rgba(0, 0, 0, .08);
      }
    }
    #resizer { height: 5px; cursor: row-resize; }
    #resizer:hover { background: var(--accent); }
    #results { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    #tabs button { background: transparent; color: var(--fg-muted); border: 1px solid transparent; border-bottom: 0; border-radius: 4px 4px 0 0; min-height: 26px; }
    #tabs button.on { background: var(--bg-elevated); color: var(--fg-strong); border-color: var(--border); }
    #tabs button.err { color: var(--err); }
    #pane { flex: 1; overflow: auto; }
    #pane table.grid td { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
    #pane table.grid td.null { color: var(--fg-faint); font-style: italic; }
    #pane table.grid th .t { font-weight: normal; color: var(--fg-faint); font-size: 10px; margin-left: 4px; }
    #pane table.grid td.rn { color: var(--fg-faint); text-align: right; }
    .msg { padding: 14px 16px; font-size: 13px; }
    .msg pre { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; white-space: pre-wrap; margin: 8px 0 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chip { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); }
    #foot { display: flex; gap: 12px; padding: 4px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--fg-muted); }

    dialog { background: var(--bg-elevated); color: var(--fg); border: 1px solid var(--border-strong); border-radius: 8px; padding: 18px 20px; width: min(480px, 92vw); }
    dialog::backdrop { background: rgba(0, 0, 0, .45); }
    .f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .f input { width: 100%; }
    .two { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
    .hint { font-size: 11px; color: var(--fg-faint); }
    .opt { display: flex; align-items: center; gap: 6px; color: var(--fg); margin: 4px 0 10px; }
    kbd { font-family: var(--mono); font-size: 11px; padding: 0 4px; border: 1px solid var(--border-strong); border-radius: 3px; }
    #bindRows { display: grid; grid-template-columns: auto 90px 1fr; gap: 8px 10px; align-items: center; margin: 10px 0 14px; }
    #bindRows .bn { font-family: var(--mono); color: var(--fg-strong); }
    #bindRows select, #bindRows input { min-height: 26px; }
    #history { position: relative; z-index: 2; }
    #historyList { position: absolute; right: 0; top: 30px; width: 420px; max-height: 300px; overflow: auto; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
    #historyList div { padding: 6px 10px; font-family: var(--mono); font-size: 11.5px; border-bottom: 1px solid var(--border); cursor: pointer; white-space: pre-wrap; max-height: 64px; overflow: hidden; }
    #historyList div:hover { background: var(--bg-hover); }

    /* ── 資料交換：其他工具分享的 SQL ── */
    #sideTabs .count { display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 4px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; line-height: 16px; }
    #sideTabs .count[hidden] { display: none; }
    .imp { display: flex; gap: 6px; align-items: center; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 12.5px; }
    .imp:hover { background: var(--bg-hover); }
    .imp.sel { background: var(--bg-active); color: var(--fg-strong); box-shadow: inset 2px 0 var(--accent); }
    .imp .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .imp .s { font-size: 11px; white-space: nowrap; }
    #importCol { overflow: auto; padding: 16px 24px 40px; min-width: 0; }
    #importCol[hidden], #mainCol[hidden] { display: none; }
    #importCol h1 { margin: 0 0 4px; font-size: 19px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .xbanner { padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 13px; line-height: 1.55; }
    .xbanner.err { background: rgba(248, 81, 73, .12); color: var(--err); }
    .xbanner.warn { background: rgba(210, 153, 34, .12); color: var(--warn); }
    .xbanner.info { background: rgba(14, 122, 211, .12); color: var(--fg-strong); }
    .xbanner.ok { background: rgba(63, 185, 80, .12); color: var(--ok); }
    .xbanner ul { margin: 4px 0 0; padding-left: 18px; }
    dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0; font-size: 13px; }
    dl.kv dt { color: var(--fg-muted); }
    dl.kv dd { margin: 0; word-break: break-all; }
    .xblock { margin-top: 18px; }
    .xblock > h3 { margin: 0 0 8px; font-size: 14px; }
    .xform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .xform select { min-width: 260px; }
    .stmt { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; background: var(--bg-elevated); }
    .stmt .hd { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; font-size: 12.5px; }
    .stmt .hd b { color: var(--fg-strong); }
    .stmt pre { margin: 0; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; background: var(--bg-sunken); font-family: var(--mono); }
    .stmt .bd { padding: 8px 12px; font-size: 12px; }
    .stmt details summary { cursor: pointer; color: var(--fg-muted); }
    .xtbl { max-height: 260px; overflow: auto; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; }
    .xtbl table.grid td, .xtbl table.grid th { font-size: 12px; }
    .xtbl td.null { color: var(--fg-faint); font-style: italic; }
    table.params td input:not([type=checkbox]), table.params td select { width: 100%; }
    table.params td { vertical-align: middle; font-size: 12.5px; }
    .xactions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .xactions .spacer { flex: 1; }
    .xres { margin-top: 8px; font-size: 12.5px; }
    .muted-sm { font-size: 12px; color: var(--fg-muted); }
  </style>
</head>
<body>
  <aside id="side">
    <div id="sideTabs"><button class="on" data-pane="objects">資料表</button><button data-pane="snippets">已存 SQL</button><button data-pane="imports" id="importsTab" title="其他工具分享的 SQL（tooldock.sql）">匯入<span class="count" id="importCount" hidden></span></button></div>

    <div class="sidePane" id="pane-objects">
      <div class="sideBar"><select id="schema" title="Schema"></select><button class="ghost" id="refreshObjects" title="重新整理">⟳</button></div>
      <div class="sideBar" style="padding-top:0"><input id="objFilter" placeholder="篩選資料表 / 檢視表"></div>
      <div class="list" id="objList"><div class="sideEmpty">連線後顯示資料表</div></div>
    </div>

    <div class="sidePane" id="pane-snippets" hidden>
      <div class="sideBar">
        <button id="saveSnippet" title="把編輯器內容存成一則 SQL">＋ 儲存目前 SQL</button>
        <button class="ghost" id="openFile" title="開啟 .sql 檔">開啟檔案</button>
        <button class="ghost" id="saveFile" title="另存為 .sql 檔">另存</button>
      </div>
      <div class="sideBar" style="padding-top:0"><input id="snipFilter" placeholder="搜尋已存的 SQL"></div>
      <div class="list" id="snipList"></div>
    </div>

    <div class="sidePane" id="pane-imports" hidden>
      <div class="sideBar">
        <button class="ghost" id="openTdx" title="匯入 .tdx 交換檔">開啟 .tdx</button>
        <button class="ghost" id="showAudit" title="執行、拒絕與取消的紀錄">稽核紀錄</button>
      </div>
      <div class="list" id="importList"></div>
    </div>
  </aside>

  <!-- 其他工具分享的 SQL：預覽、試跑、確認執行（取代主區顯示） -->
  <section id="importCol" hidden></section>

  <section id="mainCol">
    <div class="bar">
      <button class="ghost" id="toggleSide" title="顯示 / 隱藏側欄">☰</button>
      <select id="profile"></select>
      <button class="secondary" id="editProfile" title="編輯連線設定">✎</button>
      <button class="secondary" id="newProfile">＋ 新增連線</button>
      <button id="connectBtn" title="開啟這組連線；已開啟時切換過去（最多同時 5 條）">連線</button>
      <button class="secondary" id="connectNewBtn" hidden title="用同一組連線設定再開一條連線">＋ 另開</button>
      <span id="connInfo" class="muted"></span>
      <label class="row" style="gap:4px"><input type="checkbox" id="autoCommit">自動提交</label>
      <button class="secondary" id="commitBtn" disabled>Commit</button>
      <button class="secondary" id="rollbackBtn" disabled>Rollback</button>
    </div>

    <div id="sessBar" hidden></div>

    <div class="bar">
      <button id="runBtn" disabled title="執行游標所在的指令或選取範圍（⌘/Ctrl + Enter）">▶ 執行</button>
      <button class="secondary" id="runAllBtn" disabled title="依序執行全部指令（⌘/Ctrl + Shift + Enter）">▶▶ 執行全部</button>
      <button class="danger" id="cancelBtn" disabled>■ 停止</button>
      <button class="ghost" id="formatBtn" title="排版選取範圍；沒有選取時排版全部（Shift + Alt + F）。PL/SQL 區塊不排版">排版</button>
      <span class="faint" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><kbd>⌘/Ctrl</kbd>+<kbd>Enter</kbd> 執行　<code>:名稱</code> 為參數　<kbd>⌘/Ctrl</kbd>+<kbd>S</kbd> 儲存 SQL　<kbd>⌘/Ctrl</kbd>+<kbd>1</kbd>~<kbd>5</kbd> 切換連線</span>
      <span class="spacer"></span>
      <span id="history"><button class="ghost" id="historyBtn">歷史紀錄 ▾</button><div id="historyList" hidden></div></span>
    </div>

    <div id="editorWrap"><div id="sql"></div></div>
    <div id="resizer"></div>

    <div id="results">
      <div id="tabs"></div>
      <div id="pane"><div class="empty">連線後輸入 SQL 並按 ⌘/Ctrl + Enter 執行</div></div>
    </div>
    <div id="foot"><span id="footMsg"></span><span style="flex:1"></span><span id="footRight"></span></div>
  </section>

  <!-- 連線設定 -->
  <dialog id="dlg">
    <form id="form">
      <h2 id="dlgTitle">連線設定</h2>
      <input type="hidden" name="profileId">
      <div class="f"><label>名稱</label><input name="name" placeholder="例如：正式環境 HR"></div>
      <div class="two">
        <div class="f"><label>主機</label><input name="host" placeholder="db.example.com"></div>
        <div class="f"><label>連接埠</label><input name="port" type="number" value="1521"></div>
      </div>
      <div class="f"><label>服務名稱（Service Name）</label><input name="serviceName" placeholder="ORCLPDB1"></div>
      <div class="f"><label>使用者</label><input name="user" autocomplete="off"></div>
      <div class="f"><label>連線字串（選填，會取代上面的主機 / 連接埠 / 服務名稱）</label><input name="connectString" placeholder="host:port/service 或完整的 (DESCRIPTION=...)"><span class="hint">使用 Thin 模式，不需安裝 Oracle Client。</span></div>
      <div class="row" id="savedPwRow" hidden style="margin-bottom:10px"><span class="badge ok">已記住密碼</span><button type="button" class="ghost" id="forgetPw">清除記住的密碼</button></div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <button type="button" class="danger" id="removeProfile">刪除</button>
        <span class="row"><button type="button" class="secondary" id="cancelDlg">取消</button><button type="submit">儲存</button></span>
      </div>
    </form>
  </dialog>

  <!-- 密碼 -->
  <dialog id="pwDlg">
    <form id="pwForm">
      <h2>連線到 <span id="pwTarget"></span></h2>
      <div class="warn" id="pwReason" hidden style="font-size:12px;margin-bottom:8px"></div>
      <div class="f"><label>密碼</label><input name="password" type="password" autocomplete="off" required></div>
      <label class="opt" id="rememberRow"><input type="checkbox" name="remember">記住密碼<span class="hint">（以作業系統鑰匙圈加密保存）</span></label>
      <div class="hint" id="rememberNA" hidden style="margin-bottom:10px">目前的 ToolDock 版本不支援安全儲存，密碼不會被記住（需要 ToolDock 1.2.0 以上）。</div>
      <div class="row" style="justify-content:flex-end"><button type="button" class="secondary" id="pwCancel">取消</button><button type="submit">連線</button></div>
    </form>
  </dialog>

  <!-- 參數 -->
  <dialog id="bindDlg">
    <form id="bindForm">
      <h2>輸入參數</h2>
      <div class="hint">SQL 中的 <code>:名稱</code> 會以下列值綁定（不是字串替換，可避免 SQL Injection）。</div>
      <div id="bindRows"></div>
      <div class="row" style="justify-content:flex-end"><button type="button" class="secondary" id="bindCancel">取消</button><button type="submit">執行</button></div>
    </form>
  </dialog>

  <!-- 儲存 SQL -->
  <dialog id="snipDlg">
    <form id="snipForm">
      <h2>儲存 SQL</h2>
      <div class="f"><label>名稱</label><input name="name" required placeholder="例如：每月業績彙總"></div>
      <div class="hint" style="margin-bottom:10px">同名的 SQL 會被覆寫。</div>
      <div class="row" style="justify-content:flex-end"><button type="button" class="secondary" id="snipCancel">取消</button><button type="submit">儲存</button></div>
    </form>
  </dialog>

  <script src="tooldock://sdk/ui-sdk.js"></script>
  <script src="vendor/sql-editor.js"></script>
  <script src="app.js"></script>
  <script src="exchange.js"></script>
</body>
</html>
